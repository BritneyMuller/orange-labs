[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  path = "/*"
  function = "noindex-netlify-subdomain"

[[redirects]]
  from = "/ai-watermarking"
  to = "/watermarking"
  status = 301
  force = true

# Crawlers and tools often guess /sitemap.xml; point it at Astro's index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
